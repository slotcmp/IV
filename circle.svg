  <rect x="180" y="470" width="400" height="50" rx="4" fill="#fff3e0" stroke="#ef6c00" stroke-width="2" />
  <text x="380" y="490" text-anchor="middle" class="node-text node-bold">🔲 КОЛЬЦЕВОЙ FIFO-БУФЕР ШИНЫ ПРЕРЫВАНИЙ ЯДРА</text>
  <text x="380" y="508" text-anchor="middle" class="node-text" fill="#ef6c00">Ёмкость: 512 слотов | Чистый Int32Array циклический стек</text>

  <path d="M 380 520 L 380 544" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)" />
  <text x="390" y="536" class="edge-text">executeKernelReactiveTick()</text>

  <rect x="180" y="550" width="400" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="380" y="570" text-anchor="middle" class="node-text node-bold">src/core/qnx/ipc_bus.js</text>
  <text x="380" y="588" text-anchor="middle" class="node-text">Верховный канонический арбитр синхронизации тактов</text>

  <path d="M 180 575 L 120 575 L 120 624" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 580 575 L 640 575 L 640 624" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="45" y="614" class="edge-text">Сигнал ix.STACK_SET</text>
  <text x="645" y="614" class="edge-text">Сигнал ix.SYS_RENDER</text>

  <rect x="20" y="630" width="240" height="60" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="140" y="650" text-anchor="middle" class="node-text node-bold">bus/hardware_bus.js (Такт 1)</text>
  <text x="140" y="666" text-anchor="middle" class="node-text">Рокировка фокуса в ОЗУ:</text>
  <text x="140" y="680" text-anchor="middle" class="node-text" fill="#2e7d32">CORE_ACTIVE_FOCUS_ID = slotId</text>

  <polygon points="640,630 730,660 640,690 550,660" fill="#fff9c4" stroke="#fbc02d" stroke-width="2" />
  <text x="640" y="658" text-anchor="middle" class="node-text node-bold">Маска готова?</text>
  <text x="640" y="670" text-anchor="middle" class="node-text">== 0x1F?</text>

  <path d="M 550 660 L 490 660 L 490 714" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 640 690 L 640 714" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="500" y="654" class="edge-text">НЕТ (Тест / Без контроллеров)</text>
  <text x="645" y="704" class="edge-text">ДА</text>

  <rect x="340" y="720" width="260" height="65" rx="4" fill="#ffebee" stroke="#c62828" stroke-width="2" />
  <text x="470" y="740" text-anchor="middle" class="node-text node-bold" fill="#c62828">🛡️ АВАРИЙНЫЙ ШУНТ РАМОК</text>
  <text x="470" y="756" text-anchor="middle" class="node-text">Принудительный блайтинг рамок окон</text>
  <text x="470" y="772" text-anchor="middle" class="node-text">Палитра xterm 46 взводится мгновенно</text>

  <rect x="610" y="720" width="130" height="65" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="675" y="746" text-anchor="middle" class="node-text node-bold">Композиция</text>
  <text x="675" y="762" text-anchor="middle" class="node-text">Налив контента</text>

  <path d="M 470 785 L 470 804" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="340" y="810" width="260" height="45" rx="4" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2" />
  <text x="470" y="828" text-anchor="middle" class="node-text node-bold" fill="#6a1b9a">🛡️ ЗАПИРАЮЩИЙ ЗАТВОР ШТОРМА</text>
  <text x="470" y="844" text-anchor="middle" class="node-text">Выжигание эхо-импульсов 0x00B5 из FIFO</text>

  <path d="M 470 855 L 470 875 L 340 875" stroke="#37474f" stroke-width="2" fill="none" />
  <path d="M 675 785 L 675 875 L 340 875" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)" />

  <rect x="100" y="855" width="240" height="35" rx="15" fill="#cfd8dc" stroke="#37474f" stroke-width="2" />
  <text x="220" y="876" text-anchor="middle" class="node-text node-bold">📺 UHD VRAM холст сброшен в stdout</text>
