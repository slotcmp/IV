  <rect x="40" y="350" width="300" height="65" rx="4" fill="#ede7f6" stroke="#6a1b9a" stroke-width="2" />
  <text x="190" y="370" text-anchor="middle" class="node-text node-bold">mouse_reducer.js</text>
