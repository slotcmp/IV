<svg xmlns="http://w3.org" viewBox="0 0 760 900" width="100%" height="100%">
  <style>
    .grid-line { stroke: #e0e0e0; stroke-width: 1; stroke-dasharray: 4,4; }
    .title { font-family: 'Courier New', Courier, monospace; font-weight: bold; font-size: 18px; fill: #1b5e20; }
    .node-text { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; font-size: 12px; fill: #000000; }
    .node-bold { font-weight: bold; }
    .edge-text { font-family: 'Courier New', Courier, monospace; font-size: 11px; fill: #37474f; font-weight: bold; }
    .arrow { fill: #37474f; }
  </style>

  <line x1="40" y1="0" x2="40" y2="900" class="grid-line" />
  <line x1="380" y1="0" x2="380" y2="900" class="grid-line" />
  <line x1="720" y1="0" x2="720" y2="900" class="grid-line" />

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1.5 L 8 5 L 0 8.5 z" class="arrow" />
    </marker>
  </defs>

  <text x="50" y="40" class="title">АРХИТЕКТУРНАЯ СХЕМА ЯДРА QNX INT32 [СЛОТКОМПОЗИТОР GEN. III]</text>
  <line x1="50" y1="50" x2="710" y2="50" stroke="#1b5e20" stroke-width="2" />

  <rect x="180" y="80" width="400" height="50" rx="6" fill="#ffebee" stroke="#c62828" stroke-width="2" />
  <text x="380" y="100" text-anchor="middle" class="node-text node-bold">🏄 Физическое событие ввода в TTY conhost</text>
  <text x="380" y="118" text-anchor="middle" class="node-text">(Поток байт падает в буфер прерываний ядра)</text>

  <path d="M 380 130 L 380 154" stroke="#37474f" stroke-width="2" marker-end="url(#arrow)" />

  <rect x="180" y="160" width="400" height="60" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="380" y="180" text-anchor="middle" class="node-text node-bold">src/core/qnx/slot_driver/kbd_receiver.js</text>
  <text x="380" y="196" text-anchor="middle" class="node-text">Low-Level Посимвольный Приемник Прерываний STDIN</text>
  <text x="380" y="210" text-anchor="middle" class="node-text" fill="#2e7d32">Контракт: 0% GC | Мономорфные фазы сбора</text>

  <path d="M 380 220 L 380 240 L 190 240 L 190 264" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <path d="M 380 220 L 380 240 L 570 240 L 570 264" stroke="#37474f" stroke-width="2" fill="none" marker-end="url(#arrow)" />
  <text x="110" y="252" class="edge-text">Префикс ESC [ &lt;</text>
  <text x="580" y="252" class="edge-text">ALT + [0-9]</text>

  <rect x="40" y="270" width="300" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="190" y="290" text-anchor="middle" class="node-text node-bold">mouse_sgr_parser.js</text>
  <text x="190" y="308" text-anchor="middle" class="node-text">Декодирование пакета мыши в 0-based сетку</text>

  <rect x="420" y="270" width="300" height="50" rx="4" fill="#e8f5e9" stroke="#2e7d32" stroke-width="2" />
  <text x="570" y="290" text-anchor="middle" class="node-text node-bold">key_dispatcher.js</text>
  <text x="570" y="308" text-anchor="middle" class="node-text">Прямое вычисление целевого targetSlotId</text>

